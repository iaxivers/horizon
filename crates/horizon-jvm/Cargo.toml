[package]
name = "horizon-jvm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Runs Java mods inside Horizon: an embedded JVM, started only when mods-java/ holds jars"

[dependencies]
# The JNI bindings: env, strings, arrays, natives. 0.21.1 is already in Cargo.lock.
jni = "0.21.1"
# libjvm is loaded at run time from the Java the player has (Minecraft's own runtime first),
# so nothing links against a JDK at build time.
libloading = "0.8"
log = "0.4"
# Java discovery, shared with horizon-prepare: JAVA_HOME, the PATH, Minecraft's runtimes.
horizon-prepare = { path = "../horizon-prepare" }

[lints]
workspace = true
