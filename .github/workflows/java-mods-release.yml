name: java mods release
run-name: java mods release ${{ github.ref_name }}${{ inputs.dry_run && ' (dry run)' || '' }}
# The java-bridge fork's own Fabric 26.3 mods build (docs/java-bridge.md, "Fabric mods releases"), opt-in: it runs
# only in iaxivers/horizon-java-bridge, and only when asked: by pushing the commit to build to the branch `java-mods-build`, or a
# tag `java-mods-build-<anything>` on it, or by hand. It builds, on GitHub's own runners (no Minecraft jar there, nothing of Mojang's in the archives):
# - the game with Fabric Java mods (feature java-mods, HORIZON_BRIDGE_PLATFORM=source: the bridge's and the platform
#   mod's sources, built on the player's machine against the Fabric Loader fetched there and their own game; this
#   machine fetches and reads nothing of Fabric's), Linux and Windows, as game-build.yml's `<asset>-java`;
# - the fork's launcher (the "Fabric 26.3 mods (beta)" switch), which never updates itself into the main repository's.
# They go out as the moving pre-release `java-mods`, with java-mods.json (commit, launcher contract, the preparation format the build
# reads) and SHA256SUMS signed for the `java-mods` channel with the fork's own key (secret JAVA_MODS_SIGNING_KEY;
# public half in launcher/java-mods-keys.txt), as nightly-build.yml signs the Nightly: the signing job runs only
# tools/ci/sign_release.sh, and publishing checks the signature as launchers do. Launchers fetch it when the
# version's own release has no `-java` build (launcher/src/java_release.rs). Without the secret it is a dry run.
#   git push -f origin java-bridge:java-mods-build
#   git tag java-mods-build-$(date +%F) && git push origin java-mods-build-$(date +%F)
#   gh workflow run "java mods release" -R iaxivers/horizon-java-bridge --ref java-bridge -f dry_run=false
on:
  push:
    branches: [java-mods-build]
    tags: ['java-mods-build-*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign with a throwaway key, publish nothing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: java-mods-release
  cancel-in-progress: false
jobs:
  meta:
    if: github.repository == 'iaxivers/horizon-java-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: meta
        env:
          HAS_KEY: ${{ secrets.JAVA_MODS_SIGNING_KEY != '' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          date=$(date -u +%F)
          output_version=$(sed -n 's/^pub const OUTPUT_VERSION: u32 = \([0-9]*\);$/\1/p' crates/horizon-prepare/src/lib.rs)
          [[ -n "$output_version" ]] || { echo "::error::no OUTPUT_VERSION in horizon-prepare"; exit 1; }
          # The launcher contract the build is made for (launcher/src/java_release.rs CONTRACT):
          # a launcher of another contract refuses it ("needs a newer launcher").
          contract=$(sed -n 's/^pub const CONTRACT: u32 = \([0-9]*\);$/\1/p' launcher/src/java_release.rs)
          [[ -n "$contract" ]] || { echo "::error::no CONTRACT in launcher/src/java_release.rs"; exit 1; }
          keys=$(grep -cv -e '^#' -e '^[[:space:]]*$' launcher/java-mods-keys.txt || true)
          dry=$DRY_RUN
          if [[ "$HAS_KEY" != true || "$keys" == 0 ]]; then
            echo "::warning::No JAVA_MODS_SIGNING_KEY secret or no key in launcher/java-mods-keys.txt: a dry run, nothing is published"
            dry=true
          fi
          mkdir -p meta
          printf '{"commit":"%s","contract":%s,"date":"%s","output_version":%s,"ref":"%s"}\n' \
            "$sha" "$contract" "$date" "$output_version" "$GITHUB_REF_NAME" > meta/java-mods.json
          cat meta/java-mods.json
          { echo "sha=$sha"; echo "version=java-mods-$date-${sha:0:7}"; echo "dry_run=$dry"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: java-mods.json
          path: meta/java-mods.json
          if-no-files-found: error
          retention-days: 3

  build:
    needs: meta
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            java_dir: horizon-linux-x86_64-java
            java_asset: horizon-linux-x86_64-java.tar.gz
            launcher_asset: horizon-launcher-linux-x86_64.tar.gz
          - name: windows
            os: windows-latest
            java_dir: horizon-windows-x64-java
            java_asset: horizon-windows-x64-java.zip
            launcher_asset: horizon-launcher-windows-x64.zip
            exe: .exe
            # The C runtime linked in: the programs run without the Visual C++ redistributable.
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      HORIZON_VERSION: ${{ needs.meta.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
      - name: Nothing of Mojang's in the tree
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/check_public_tree.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target-java
            launcher
          shared-key: java-mods-${{ matrix.name }}
      - name: Libraries the game and GPUI link to
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev
      - name: Java 25 (the bridge's own classes are compiled with it)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: The game with Fabric Java mods (its platform mod is built on the player's machine)
        env:
          # The sources, never a platform jar: this machine has no Minecraft jar to build against.
          HORIZON_BRIDGE_PLATFORM: source
          CARGO_TARGET_DIR: target-java
        run: |
          set -euo pipefail
          cargo build --release --locked -p horizon-client --features java-mods --bin horizon-client
          bin=target-java/release/horizon-client${{ matrix.exe }}
          "$bin" --help | grep -q -- '--resources'
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/check_imports.py "$bin"
          # The source build fetched and read nothing of Fabric's here (build.rs downloads only for a jar build).
          [[ ! -e .local/bridge ]] || { echo "::error::Fabric's files were fetched on the build machine"; ls -R .local/bridge; exit 1; }
      - name: The fork's launcher (the Fabric switch; never self-updates into the main repository's)
        working-directory: launcher
        env:
          HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
          # Microsoft sign-in (docs/microsoft-account.md): the repository variable, as launcher.yml. Unset, the
          # launcher says sign-in is not configured, and the Fabric switch, which needs it, downloads nothing.
          HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$HORIZON_MSA_CLIENT_ID" ]] || echo "::warning::No HORIZON_MSA_CLIENT_ID variable: this launcher can't sign in"
          cargo test --release --locked --lib -- java_release java_variant
          cargo build --release --locked
          "target/release/horizon-launcher${{ matrix.exe }}" --version
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.java_dir }}" dist/launcher
          # The launcher installs this folder as a version's java/ and plays it with that version's own tools and
          # prepared files: only the game, its licences and where it came from.
          cp "target-java/release/horizon-client${{ matrix.exe }}" "dist/${{ matrix.java_dir }}/"
          cp LICENSE THIRD_PARTY_NOTICES.md "dist/${{ matrix.java_dir }}/"
          cp "launcher/target/release/horizon-launcher${{ matrix.exe }}" dist/launcher/
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a -tzip "${{ matrix.java_asset }}" "${{ matrix.java_dir }}" > /dev/null
            (cd launcher && 7z a -tzip "../${{ matrix.launcher_asset }}" "horizon-launcher.exe" > /dev/null)
            listing=$(7z l -slt "${{ matrix.java_asset }}" | sed -n 's/^Path = //p')
          else
            tar czf "${{ matrix.java_asset }}" "${{ matrix.java_dir }}"
            (cd launcher && tar czf "../${{ matrix.launcher_asset }}" horizon-launcher)
            listing=$(tar tzf "${{ matrix.java_asset }}")
          fi
          echo "$listing"
          # Exactly what was put in: no jar, no asset, nothing of Mojang's.
          stray=$(echo "$listing" | tr '\\' '/' | grep -v -E "^(${{ matrix.java_asset }}|${{ matrix.java_dir }}/?|${{ matrix.java_dir }}/(horizon-client(\.exe)?|LICENSE|THIRD_PARTY_NOTICES\.md))$" || true)
          [[ -z "$stray" ]] || { echo "::error::unexpected files: $stray"; exit 1; }
          # Nothing of Fabric's (Loader, Mixin, Sat4j, ASM, Fabric API) in the repository or the archives:
          # they are fetched on the player's machine (docs/java-bridge.md, "Ownership").
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} ../tools/java_bridge/check_no_fabric.py --tree \
            "${{ matrix.java_asset }}" "${{ matrix.launcher_asset }}"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.java_asset }}
          path: dist/${{ matrix.java_asset }}
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.launcher_asset }}
          path: dist/${{ matrix.launcher_asset }}
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only the signing script: the job holding the key runs nothing else of the repository's.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
          sparse-checkout: tools/ci/sign_release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign the checksums for the java-mods channel
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.JAVA_MODS_SIGNING_KEY }}
          EPHEMERAL: ${{ needs.meta.outputs.dry_run == 'true' && 'yes' || '' }}
        run: |
          bash tools/ci/sign_release.sh java-mods dist/horizon-linux-x86_64-java.tar.gz dist/horizon-windows-x64-java.zip \
            dist/horizon-launcher-linux-x86_64.tar.gz dist/horizon-launcher-windows-x64.zip dist/java-mods.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/ephemeral.pub
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [meta, build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: The signature, checked as launchers check it (launcher/java-mods-keys.txt)
        env:
          DRY_RUN: ${{ needs.meta.outputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == true ]]; then key=$(cat dist/ephemeral.pub); else key=$(grep -v -e '^#' -e '^[[:space:]]*$' launcher/java-mods-keys.txt); fi
          args=(); while read -r k; do args+=(--key "$k"); done <<< "$key"
          rm -f dist/ephemeral.pub
          cargo run --locked --quiet -p horizon-release-sign -- verify --tag java-mods "${args[@]}" dist
      - name: Publish as the `java-mods` pre-release
        if: needs.meta.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.meta.outputs.sha }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          notes=$(printf 'Fabric 26.3 mods (beta) for Horizon, from %s (%s). Not a Horizon release: the java-bridge fork'"'"'s.\n\nThe launcher here has the Fabric switch and installs the game build below by itself; see the README'"'"'s "Try it". Signed for the java-mods channel (SHA256SUMS.sig).' "$GITHUB_REF_NAME" "${SHA:0:7}")
          # One moving pre-release, never the repository's latest.
          gh release delete java-mods --cleanup-tag --yes -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create java-mods -R "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$SHA" \
            --title "Fabric mods build $VERSION" --notes "$notes" \
            "dist/horizon-launcher-linux-x86_64.tar.gz#Launcher with Fabric mods: Linux (horizon-launcher-linux-x86_64.tar.gz)" \
            "dist/horizon-launcher-windows-x64.zip#Launcher with Fabric mods: Windows (horizon-launcher-windows-x64.zip)" \
            "dist/horizon-linux-x86_64-java.tar.gz#Game with Fabric mods, installed by the launcher: Linux" \
            "dist/horizon-windows-x64-java.zip#Game with Fabric mods, installed by the launcher: Windows" \
            dist/java-mods.json dist/SHA256SUMS dist/SHA256SUMS.sig
      - name: Dry run, what would be published
        if: needs.meta.outputs.dry_run == 'true'
        run: ls -l dist
